<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — St. John's Lacrosse Practice Plans</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #faf7f2; color: #1a1a1a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: #faf7f2; border-bottom: 1px solid #e5ddd0; padding: 18px 24px; }
  header h1 { margin: 0; font-family: "Arial Narrow", Arial, sans-serif; font-size: 28px; letter-spacing: .04em; color: #a6192e; text-transform: uppercase; }
  header p { margin: 2px 0 0; color: #6b6259; font-size: 14px; }
  main { max-width: 460px; margin: 48px auto; padding: 0 20px; }
  .card { background: #fff; border: 1px solid #e5ddd0; border-radius: 10px; padding: 28px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  h2 { margin: 0 0 6px; font-family: "Arial Narrow", Arial, sans-serif; font-size: 24px; text-transform: uppercase; color: #a6192e; }
  .sub { color: #6b6259; font-size: 14px; margin: 0 0 20px; }
  label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6b6259; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid #d8cfc0; border-radius: 8px; font-size: 15px; background: #fff; }
  input:focus { outline: 2px solid #c8a24a; border-color: #c8a24a; }
  button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 999px; background: #a6192e; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:hover { background: #8f1427; }
  .toggle { text-align: center; margin-top: 16px; font-size: 14px; color: #6b6259; }
  .toggle a { color: #a6192e; font-weight: 700; cursor: pointer; text-decoration: underline; }
  .msg { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; }
  .msg.err { display: block; background: #fdecea; color: #8f1427; border: 1px solid #f3c1bd; }
  .msg.ok { display: block; background: #eef7ee; color: #1d5c2e; border: 1px solid #bfe0c2; }
  .msg.info { display: block; background: #fdf6e3; color: #6b5312; border: 1px solid #e8d9a8; }
  .gold { height: 4px; background: #c8a24a; }
</style>
</head>
<body>
<header>
  <h1>St. John's Lacrosse</h1>
  <p>Practice Plans — please log in to continue</p>
</header>
<div class="gold"></div>
<main>
  <div class="card">
    <h2 id="formTitle">Log in</h2>
    <p class="sub" id="formSub">Log in to use the practice plans program.</p>
    <div id="nameRow" style="display:none">
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="name" placeholder="Your name">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
    <button id="submitBtn" type="button">Log in</button>
    <div id="msg" class="msg"></div>
    <p class="toggle" id="toggleText">Don't have an account? <a id="toggleLink">Create one</a></p>
  </div>
</main>
<script>
(function () {
  var mode = 'login';
  var msg = document.getElementById('msg');
  var title = document.getElementById('formTitle');
  var sub = document.getElementById('formSub');
  var nameRow = document.getElementById('nameRow');
  var btn = document.getElementById('submitBtn');
  var toggleText = document.getElementById('toggleText');

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + (kind || 'err');
  }
  function setMode(m) {
    mode = m;
    msg.className = 'msg';
    msg.textContent = '';
    if (m === 'signup') {
      title.textContent = 'Create an account';
      sub.textContent = 'New accounts wait for approval before they can log in.';
      nameRow.style.display = 'block';
      btn.textContent = 'Create account';
      toggleText.innerHTML = 'Already have an account? <a id="toggleLink">Log in</a>';
    } else {
      title.textContent = 'Log in';
      sub.textContent = 'Log in to use the practice plans program.';
      nameRow.style.display = 'none';
      btn.textContent = 'Log in';
      toggleText.innerHTML = 'Don\'t have an account? <a id="toggleLink">Create one</a>';
    }
    document.getElementById('toggleLink').addEventListener('click', function () {
      setMode(mode === 'login' ? 'signup' : 'login');
    });
  }
  document.getElementById('toggleLink').addEventListener('click', function () {
    setMode(mode === 'login' ? 'signup' : 'login');
  });

  var params = new URLSearchParams(window.location.search);
  if (params.get('notice') === 'waiting') {
    show('Your account is waiting for approval. You will be able to log in once it is approved.', 'info');
  }

  btn.addEventListener('click', async function () {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var name = document.getElementById('name').value.trim();
    btn.disabled = true;
    try {
      var url = mode === 'login' ? '/api/login' : '/api/signup';
      var body = mode === 'login' ? { email: email, password: password } : { name: name, email: email, password: password };
      var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      var data = await res.json();
      if (!res.ok) {
        show(data.error || 'Something went wrong. Please try again.', 'err');
        return;
      }
      if (mode === 'signup') {
        if (data.user && data.user.status === 'approved') {
          window.location.href = '/';
        } else {
          show('Account created. It is waiting for approval — you will be able to log in once it is approved.', 'ok');
        }
        return;
      }
      window.location.href = '/';
    } catch (e) {
      show('Could not reach the server. Please try again.', 'err');
    } finally {
      btn.disabled = false;
    }
  });
  document.getElementById('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });
})();
</script>
</body>
</html>
