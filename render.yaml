services:
  - type: web
    name: st-johns-lacrosse-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: st-johns-lacrosse-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: alericfyock1@gmail.com
      - key: NOTIFY_TOKEN
        generateValue: true
databases:
  - name: st-johns-lacrosse-db
    plan: free
