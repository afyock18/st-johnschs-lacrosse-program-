<title>St. Johnschs Lacrosse Program</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--red:#a6192e;--red-ink:#ffffff;--gold:#c8a24a;--bg:#faf7f2;--card:#ffffff;--ink:#1c1a17;--mut:#6f6a61;--line:#ddd5c7;--soft:#f3eee5;--green:#1e7a3c;--blue:#2456a6;--bad:#b3261e;--display:"Arial Narrow","Helvetica Neue","Roboto Condensed",sans-serif}
@media (prefers-color-scheme:dark){:root{--red:#e05260;--red-ink:#1c0a0d;--bg:#17140f;--card:#221e18;--ink:#f2ede3;--mut:#a89f8f;--line:#3d372c;--soft:#2b261e;--bad:#e05260}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
button,[role=button],select,input:not([type=checkbox]),textarea{min-height:2rem;font-family:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.5rem .75rem;font-size:.875rem;font-weight:500}
button.primary{background:var(--red);color:var(--red-ink);border-color:var(--red);font-weight:600;padding:.5rem 1rem}
button.gold{background:var(--gold);color:#1c1a17;border-color:var(--gold);font-weight:600}
button.danger{color:var(--bad)}button.small{border-radius:6px;padding:.25rem .5rem;font-size:.75rem;font-weight:500}
input,select,textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.5rem .75rem;font-size:1rem;width:100%}
label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--mut);display:block;margin:.6rem 0 .3rem}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb, var(--bg) 95%, transparent);backdrop-filter:blur(2px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1152px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.75rem 1rem}
.brand{font-family:var(--display);font-size:1.125rem;font-weight:700;text-transform:uppercase;letter-spacing:.025em;color:var(--red);margin-right:.25rem}.brand-logo{width:40px;height:40px;border-radius:50%;flex-shrink:0}
#logoutBtn{border:none;background:transparent;color:var(--mut);font-weight:600}#welcomeUser{color:var(--mut);font-weight:600;font-size:.875rem;white-space:nowrap}
.shared-note{background:var(--soft);color:var(--mut);font-size:.85rem;text-align:center;padding:.5rem 1rem;border-bottom:1px solid var(--line)}
.shared-note b{color:var(--ink)}
.wrap{max-width:1152px;margin:0 auto;padding:0 1rem 4rem}
h1{font-family:var(--display);font-size:1.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.025em;margin:.4rem 0 .2rem}h2{font-family:var(--display);font-size:1.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.025em;margin:0 0 .25rem}h3{font-family:var(--display);font-size:1.125rem;font-weight:700;text-transform:uppercase;letter-spacing:.025em;margin:.8rem 0 .4rem}
.sub{color:var(--mut);font-size:.875rem;margin:.2rem 0 1rem}
nav.tabs{display:flex;flex-wrap:wrap;gap:.25rem;margin-left:auto}
nav.tabs button{border:none;background:transparent;color:var(--mut);font-weight:600;padding:.5rem .75rem}
nav.tabs button.active{background:var(--red);color:var(--red-ink)}
.subtabs{display:flex;flex-wrap:wrap;gap:.25rem;margin:1rem 0}
.subtabs button{border-radius:999px;padding:.5rem .875rem;font-weight:600;color:var(--mut)}
.subtabs button.active{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.linklike{background:none;border:none;color:var(--red);font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:0;min-height:0;font-size:inherit;display:inline}
.intro{font-size:.875rem;line-height:1.6;color:var(--mut);margin:.5rem 0 0;max-width:34rem}
.planlist{list-style:none;margin:1rem 0 0;padding:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.planlist li+li{border-top:1px solid var(--line)}
.planrow{display:flex;width:100%;align-items:flex-start;gap:.75rem;text-align:left;background:transparent;border:none;border-radius:0;padding:.75rem .5rem}
.planrow.active{background:var(--soft)}
.planrow-main{flex:1;min-width:0}
.planrow-title{display:block;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planrow-meta{display:block;font-size:.875rem;color:var(--mut);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planrow-side{flex-shrink:0;text-align:right}
.planrow-dur{display:block;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.875rem;font-weight:600}
.badge-draft{display:inline-block;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:.125rem .5rem;font-size:.75rem;font-weight:600;margin-top:.25rem}
.plans-empty-note{color:var(--mut);text-align:center;padding:4rem 1rem}
.empty-note{color:var(--mut);text-align:center;margin-top:2rem;font-size:.875rem;line-height:1.6}
@media(min-width:1024px){.plans-layout{display:grid;grid-template-columns:340px 1fr;gap:2rem}.only-mobile{display:none}}

function parseTime(t){if(!t)return 15*60+30;var p=t.split(':');return (+p[0])*60+(+p[1])}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

function toggleFocus(c){var i=S.genFocus.indexOf(c);if(i>=0)S.genFocus.splice(i,1);else S.genFocus.push(c);render()}
function moveFocus(i,d){var j=i+d;if(j<0||j>=S.genFocus.length)return;var t=S.genFocus[i];S.genFocus[i]=S.genFocus[j];S.genFocus[j]=t;render()}
function syncGen(){var s=parseTime(document.getElementById('gStart').value),l=+document.getElementById('gLen').value||90;var e=s+l;document.getElementById('gEnd').value=('0'+Math.floor(e/60)).slice(-2)+':'+('0'+(e%60)).slice(-2);genForm.start=document.getElementById('gStart').value;genForm.len=l;genForm.end=document.getElementById('gEnd').value;var h=document.getElementById('gEndHint');if(h)h.textContent=fmtTime(s)+' – '+fmtTime(e)+' · '+fmtDur(l)+' scheduled';updateGenPreview()}
function syncGenEnd(){var s=parseTime(document.getElementById('gStart').value),e=parseTime(document.getElementById('gEnd').value);if(e>s)document.getElementById('gLen').value=e-s;genForm.start=document.getElementById('gStart').value;genForm.end=document.getElementById('gEnd').value;genForm.len=+document.getElementById('gLen').value||90;var h=document.getElementById('gEndHint');if(h)h.textContent=fmtTime(s)+' – '+fmtTime(e)+' · '+fmtDur(e-s)+' scheduled';updateGenPreview()}
function genPicks(len){var picks=[],unmatched=[],per=S.genFocus.length?Math.max(5,Math.round(len/S.genFocus.length)):0;S.genFocus.forEach(function(c,ci){var ds=S.drills.filter(function(d){return d.cat===c});if(!ds.length){unmatched.push(c);return}var used=0,di=S.genVary?(ci% ds.length):0,guard=0;while(used<per&&guard<40){var d=ds[di%ds.length];picks.push({name:d.name,cat:d.cat,mins:d.mins});used+=d.mins;di++;guard++}});return{picks:picks,unmatched:unmatched}}
function updateGenPreview(){var el=document.getElementById('genPreview');if(!el)return;var len=+((document.getElementById('gLen')||{}).value||90);var r=genPicks(len);var tot=r.picks.reduce(function(a,b){return a+b.mins},0);if(!S.genFocus.length){el.innerHTML='Pick at least one category to generate.';return}if(!r.picks.length){el.innerHTML='No drills in your bank match that focus yet — try a category name from your bank.';return}el.innerHTML='<b>Instant preview:</b> '+r.picks.length+' drill'+(r.picks.length===1?'':'s')+' · about '+tot+' min, in your focus order.'+(r.unmatched.length?' No drills match "'+r.unmatched.map(esc).join(', ')+'" — those steps will be left for you to add by hand.':'')}

function generatePlan(len){if(!S.genFocus.length){toast('Pick at least one category first');return}var r=genPicks(len||90);if(!r.picks.length){toast('No drills match those categories yet');return}var tot=r.picks.reduce(function(a,b){return a+b.mins},0);if(tot>len){var over=tot-len,last=r.picks[r.picks.length-1];last.mins=Math.max(1,last.mins-over)}genCounter++;var rot=S.genVary?genCounter%3:0;if(rot&&r.picks.length>1){r.picks=r.picks.slice(rot).concat(r.picks.slice(0,rot))}
 var p={title:(document.getElementById('gTitle')||{}).value||'',date:(document.getElementById('gDate')||{}).value||todayStr(),start:(document.getElementById('gStart')||{}).value||'15:30',end:(document.getElementById('gEnd')||{}).value||'17:00',location:(document.getElementById('gLoc')||{}).value||'',blocks:r.picks,reminders:'',notes:'',color:S.teamColor,focus:S.genFocus.slice()};
 S.plans.push(p);resetGenForm();editPlanIdx=S.plans.length-1;S.sub='your';render();syncSaveImmediate();toast('Plan generated — '+r.picks.length+' drills, '+planTotal(p)+' min')}

function buildHTML(){
 var cats=S.cats.map(function(c){var ds=S.drills.filter(function(d){return d.cat===c});if(!ds.length)return '';return '<details><summary>'+esc(c)+' ('+ds.length+')</summary>'+ds.map(function(d){return '<div class="row" style="padding:.375rem 0"><span class="grow"><b style="font-weight:500">'+esc(d.name)+'</b><span class="pill-outline" style="margin-left:.5rem">'+esc(d.cat)+'</span><span style="display:block;margin-top:.125rem;font-size:.75rem;color:var(--mut)">'+d.mins+' min</span></span><button class="small primary" onclick="S.buildPicks.push(\''+esc(d.name).replace(/'/g,"\\'")+'\');render()">Add</button></div>'}).join('')+'</details>'}).join('');
 var tot=0;var order=S.buildPicks.map(function(n,i){var d=drillByName(n);if(d)tot+=d.mins;return '<div class="focusrow"><span class="focusnum">'+(i+1)+'</span><span class="grow">'+esc(n)+(d?' — '+d.mins+' min · '+esc(d.cat):'')+'</span><button class="small" '+(i===0?'disabled':'')+' onclick="var t=S.buildPicks['+i+'];S.buildPicks['+i+']=S.buildPicks['+(i-1)+'];S.buildPicks['+(i-1)+']=t;render()">↑</button><button class="small" '+(i===S.buildPicks.length-1?'disabled':'')+' onclick="var t=S.buildPicks['+i+'];S.buildPicks['+i+']=S.buildPicks['+(i+1)+'];S.buildPicks['+(i+1)+']=t;render()">↓</button><button class="small" onclick="S.buildPicks.splice('+i+',1);render()">Remove</button></div>'}).join('');
 return '<div><h2>Build your own plan</h2><div class="genwrap"><div class="card formcard"><div class="grid2"><div><label>Title (optional)</label><input id="bTitle" value="'+esc(buildForm.title)+'" oninput="buildForm.title=this.value"></div><div><label>Date</label><input id="bDate" type="date" value="'+(buildForm.date||todayStr())+'" oninput="buildForm.date=this.value"></div><div><label>Start time</label><input id="bStart" type="time" value="'+esc(buildForm.start)+'" oninput="buildForm.start=this.value"></div><div><label>End time</label><input id="bEnd" type="time" value="'+esc(buildForm.end)+'" oninput="buildForm.end=this.value"></div><div><label>Location</label><input id="bLoc" value="'+esc(buildForm.loc)+'" oninput="buildForm.loc=this.value"></div></div></div>'
 +'<div class="card"><p class="formtitle">Pick drills — they run in pick order</p>'+cats+'</div>'
 +'<div class="card"><p class="formtitle">Running order — '+S.buildPicks.length+' drills · '+tot+' min</p>'+(order||'<p class="hint">No drills picked yet.</p>')+'<div class="row" style="margin-top:.75rem"><button class="primary" onclick="saveBuilt()">Save as plan</button><button onclick="S.buildPicks=[];resetBuildForm();S.sub=\'your\';render()">Done</button></div></div>'
 +'</div></div>';
}
function saveBuilt(){if(!S.buildPicks.length){toast('Pick at least one drill');return}var blocks=S.buildPicks.map(function(n){var d=drillByName(n);return{name:d.name,cat:d.cat,mins:d.mins}});S.plans.push({title:document.getElementById('bTitle').value||'',date:document.getElementById('bDate').value,start:document.getElementById('bStart').value,end:document.getElementById('bEnd').value,location:document.getElementById('bLoc').value,blocks:blocks,reminders:'',notes:'',color:S.teamColor,focus:[]});S.buildPicks=[];resetBuildForm();S.sub='your';editPlanIdx=S.plans.length-1;render();syncSaveImmediate();toast('Plan saved')}
/* ----- Monthly breakdown ----- */
function breakdownHTML(){var months={};S.plans.forEach(function(p){if(p.date)months[p.date.slice(0,7)]=1});var opts=Object.keys(months).sort();var cur=opts.length?opts[opts.length-1]:todayStr().slice(0,7);return '<div><h2>Drills practiced, month by month</h2><p class="pagesub">Which drills and categories your plans actually ran, by month.</p><div class="frow" style="margin-top:1.5rem"><div><label>Month</label><input type="month" id="bdMonth" value="'+cur+'" style="width:auto" onchange="calcBreakdown()"></div><div><label>Count by</label><select id="bdMode" style="width:auto" onchange="calcBreakdown()"><option value="drills">By drills run</option><option value="mins">By minutes</option></select></div><button onclick="calcBreakdown()">Refresh now</button></div><div id="bdOut"></div><p class="sub" id="bdStamp"></p></div>'}
function calcBreakdown(){var out=document.getElementById('bdOut');if(!out)return;var m=document.getElementById('bdMonth').value,mode=document.getElementById('bdMode').value;var byCat={},byDrill={},total=0;S.plans.forEach(function(p){if(!p.date||p.date.slice(0,7)!==m)return;p.blocks.forEach(function(b){var v=mode==='mins'?b.mins:1;byCat[b.cat]=(byCat[b.cat]||0)+v;byDrill[b.name]=(byDrill[b.name]||0)+v;total+=v})});S.lastCalc=new Date().toLocaleString();document.getElementById('bdStamp').textContent='Last calculated: '+S.lastCalc;
 if(!total){out.innerHTML='<div class="emptydash" style="margin-top:1.5rem"><b>No dated plans in this month yet</b><p class="hint">Generate or build a plan with a date in this month and it will be counted here.</p></div>';return}
 var cols=['#a6192e','#c8a24a','#2456a6','#1e7a3c','#7a4a9e','#c2611a','#2a7a8c','#8c2a4a'];var acc=0,cx=100,cy=100,r=88,paths='';var keys=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]});
 keys.forEach(function(k,i){var frac=byCat[k]/total;var a0=acc*2*Math.PI-Math.PI/2;acc+=frac;var a1=acc*2*Math.PI-Math.PI/2;var large=frac>.5?1:0;paths+='<path d="M'+cx+','+cy+' L'+(cx+r*Math.cos(a0))+','+(cy+r*Math.sin(a0))+' A'+r+','+r+' 0 '+large+' 1 '+(cx+r*Math.cos(a1))+','+(cy+r*Math.sin(a1))+' Z" fill="'+cols[i%cols.length]+'"/>';});
 var legend=keys.map(function(k,i){return '<tr><td><span class="swatch" style="background:'+cols[i%cols.length]+'"></span>'+esc(k)+'</td><td class="num">'+byCat[k]+'</td><td class="num">'+Math.round(byCat[k]/total*100)+'%</td></tr>'}).join('');
 var drills=Object.keys(byDrill).sort(function(a,b){return byDrill[b]-byDrill[a]}).map(function(k){return '<tr><td>'+esc(k)+'</td><td class="num">'+byDrill[k]+'</td></tr>'}).join('');
 out.innerHTML='<div class="kpi kpi2" style="margin-top:1.5rem"><div class="kpic"><b>'+total+'</b><span>Total '+(mode==='mins'?'minutes':'drills run')+'</span></div><div class="kpic"><b>'+keys.length+'</b><span>Categories practiced</span></div></div><div class="bdgrid" style="margin-top:1.5rem"><div><svg viewBox="0 0 200 200" style="width:100%;max-width:420px;margin:0 auto;display:block">'+paths+'</svg><p class="hint" style="text-align:center">Share of '+(mode==='mins'?'minutes':'drills run')+' in '+m+'</p></div><div><table class="bdtable"><tr><th>Category</th><th class="num">'+(mode==='mins'?'Minutes':'Drills')+'</th><th class="num">Share</th></tr>'+legend+'</table></div></div><p class="formtitle" style="margin-top:1.5rem">Per drill</p><table class="bdtable"><tr><th>Drill</th><th class="num">'+(mode==='mins'?'Minutes':'Times run')+'</th></tr>'+drills+'</table>'}
</script>
<script>
/* ---------- DRILL BANK ---------- */
var drillFilter={q:'',cat:'all'},editDrillId=-1;
function renderDrills(){
 var list=S.drills.filter(function(d){return (drillFilter.cat==='all'||d.cat===drillFilter.cat)&&(!drillFilter.q||d.name.toLowerCase().indexOf(drillFilter.q)>=0)});
 var h='<div class="pt4"><div class="pagehead"><h2>Drill bank</h2><button class="primary" onclick="document.getElementById(\'drillForm\').scrollIntoView({behavior:\'smooth\'});var n=document.getElementById(\'dName\');if(n)n.focus()">New drill</button></div>'
 +'<div class="row" style="margin-top:1rem"><input class="grow" placeholder="Search drills…" value="'+esc(drillFilter.q)+'" oninput="drillFilter.q=this.value.toLowerCase();renderDrillsSoft()"><select style="width:auto" onchange="drillFilter.cat=this.value;render()"><option value="all">All categories</option>'+S.cats.map(function(c){return '<option'+(drillFilter.cat===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>'
 +'<div class="card" style="margin-top:.75rem"><p class="formtitle">Categories</p><div class="row"><input class="grow" id="newCat" placeholder="New category name"><button class="primary" onclick="addCat()">Add category</button></div><div class="catlist">'+S.cats.map(function(c,i){var n=S.drills.filter(function(d){return d.cat===c}).length;if(renameCatIdx===i)return '<div class="catrow"><input class="grow" id="renameCatInput" value="'+esc(c)+'"><button class="small primary" onclick="saveRenameCat('+i+')">Save name</button><button class="small" onclick="renameCatIdx=-1;render()">Cancel</button></div>';return '<div><div class="catrow" onclick="toggleCat('+i+')"><span style="width:1rem;color:var(--mut)">'+(expandedCatIdx===i?'▾':'▸')+'</span><span class="grow" style="font-weight:500">'+esc(c)+'</span><span style="font-size:.875rem;color:var(--mut)">'+n+' drill'+(n===1?'':'s')+'</span><button class="btn-accent-outline" onclick="event.stopPropagation();renameCat('+i+')">Rename</button><button class="small" style="color:var(--red)" onclick="event.stopPropagation();deleteCat('+i+')">Delete</button></div>'+(expandedCatIdx===i?catDrillsHTML(c):'')+'</div>'}).join('')+'</div></div>'
 +'<div id="drillList" class="drillgrid" style="margin-top:1rem">'+drillListHTML(list)+'</div>';
 h+='<div class="card formcard" id="drillForm" style="margin-top:1rem"><p class="formtitle">'+(editDrillId>=0?'Edit drill':'Add a drill')+'</p><div class="grid2"><div><label>Name</label><input id="dName"></div><div><label>Category</label><select id="dCat">'+S.cats.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select></div><div><label>Default length (min, 1-min steps)</label><input id="dMins" type="number" step="1" value="10"></div><div><label>Equipment</label><input id="dEquip"></div><div><label>Setup</label><input id="dSetup"></div><div><label>Players</label><input id="dPlayers"></div></div><div><label>Offensive coaching points</label><textarea id="dOff" rows="2"></textarea></div><div><label>Defensive coaching points</label><textarea id="dDef" rows="2"></textarea></div><div><label>Video example</label><input id="dVideo" type="file" accept="video/*"></div><div class="row" style="margin-top:.75rem"><button class="primary" onclick="saveDrill()">'+(editDrillId>=0?'Save changes':'Add drill')+'</button>'+(editDrillId>=0?'<button onclick="editDrillId=-1;render()">Cancel edit</button>':'')+'</div></div>';
 h+='</div>';
 app.innerHTML=h;
 if(editDrillId>=0){var d=S.drills.filter(function(x){return x.id===editDrillId})[0];if(d){document.getElementById('dName').value=d.name;document.getElementById('dCat').value=d.cat;document.getElementById('dMins').value=d.mins;document.getElementById('dEquip').value=d.equip;document.getElementById('dSetup').value=d.setup;document.getElementById('dPlayers').value=d.players;document.getElementById('dOff').value=d.off;document.getElementById('dDef').value=d.def}}
}
function drillListHTML(list){if(!list.length)return '<p class="empty-note">No drills match.</p>';return list.map(function(d){return '<div class="card" style="margin:0"><div class="row" style="align-items:baseline;gap:.25rem .75rem"><b style="font-size:1.125rem;font-weight:600">'+esc(d.name)+'</b><span class="catlabel">'+esc(d.cat)+'</span><span style="font-family:ui-monospace,Menlo,monospace;font-size:.875rem;color:var(--mut)">'+d.mins+' min</span></div>'+(d.equip?'<p style="margin:.5rem 0 0;font-size:.875rem">Equipment: '+esc(d.equip)+'</p>':'')+(d.setup?'<p style="margin:.25rem 0 0;font-size:.875rem;white-space:pre-wrap">'+esc(d.setup)+'</p>':'')+(d.players?'<p style="margin:.25rem 0 0;font-size:.875rem">Players: '+esc(d.players)+'</p>':'')+(d.off?'<div class="coachbox"><h4>Offensive coaching points</h4><p>'+esc(d.off)+'</p></div>':'')+(d.def?'<div class="coachbox"><h4>Defensive coaching points</h4><p>'+esc(d.def)+'</p></div>':'')+(d.video?'<video src="'+d.video+'" controls style="margin-top:.75rem;aspect-ratio:16/9;width:100%;max-width:36rem;border-radius:10px;background:#000;object-fit:contain"></video>':'')+'<div class="row" style="gap:.25rem;margin-top:.75rem"><button class="small" onclick="editDrillId='+d.id+';render();document.getElementById(\'drillForm\').scrollIntoView()">Edit</button><button class="small" style="color:var(--red)" onclick="askConfirm(\'Delete this drill?\',function(){S.drills=S.drills.filter(function(x){return x.id!=='+d.id+'});render()})">Delete</button></div></div>'}).join('')}
function renderDrillsSoft(){var list=S.drills.filter(function(d){return (drillFilter.cat==='all'||d.cat===drillFilter.cat)&&(!drillFilter.q||d.name.toLowerCase().indexOf(drillFilter.q)>=0)});document.getElementById('drillList').innerHTML=drillListHTML(list)}
function saveDrill(){var name=document.getElementById('dName').value.trim();if(!name){toast('Give the drill a name');return}var v=document.getElementById('dVideo');var obj={name:name,cat:document.getElementById('dCat').value,mins:Math.max(1,+document.getElementById('dMins').value||10),equip:document.getElementById('dEquip').value,setup:document.getElementById('dSetup').value,players:document.getElementById('dPlayers').value,off:document.getElementById('dOff').value,def:document.getElementById('dDef').value,video:''};
 if(editDrillId>=0){var d=S.drills.filter(function(x){return x.id===editDrillId})[0];obj.video=d.video;Object.assign(d,obj);editDrillId=-1;toast('Drill updated')}else{obj.id=id();S.drills.push(obj);if(v.files&&v.files[0])obj.video=URL.createObjectURL(v.files[0]);toast('Drill added')}render()}
function addCat(){var v=document.getElementById('newCat').value.trim();if(!v)return;if(S.cats.indexOf(v)>=0){toast('That category already exists');return}S.cats.push(v);render();toast('Category added')}
var renameCatIdx=-1,expandedCatIdx=-1;
function toggleCat(i){expandedCatIdx=(expandedCatIdx===i)?-1:i;render()}
function catDrillsHTML(c){var ds=S.drills.filter(function(d){return d.cat===c});if(!ds.length)return '<div class="catdrills"><p class="empty-note" style="margin:.25rem 0">No drills in this category yet</p></div>';return '<div class="catdrills">'+ds.map(function(d){return '<div class="catdrill" onclick="editDrillId='+d.id+';render();document.getElementById(\'drillForm\').scrollIntoView()"><span style="font-weight:500">'+esc(d.name)+'</span><span style="font-size:.875rem;color:var(--mut)">'+d.mins+' min · Edit</span></div>'}).join('')+'</div>'}
function renameCat(i){renameCatIdx=i;render()}
function saveRenameCat(i){var inp=document.getElementById('renameCatInput');var n=inp?inp.value.trim():'';if(!n){renameCatIdx=-1;render();return}var old=S.cats[i];S.cats[i]=n;S.drills.forEach(function(d){if(d.cat===old)d.cat=n});S.genFocus=S.genFocus.map(function(c){return c===old?n:c});renameCatIdx=-1;render();toast('Category renamed')}
function deleteCat(i){var c=S.cats[i];if(S.drills.some(function(d){return d.cat===c})){toast('Move or delete its drills first — "'+c+'" still has drills');return}askConfirm('Delete category "'+c+'"?',function(){S.cats.splice(i,1);if(expandedCatIdx===i)expandedCatIdx=-1;else if(expandedCatIdx>i)expandedCatIdx--;render()})}
/* ---------- ROSTER ---------- */
var rosterTab='current',editPlayerId=-1,rosterQ='',rosterPos='all',rosterTeam='all',rosterSort='name';
function renderRoster(){
 var poss=[];S.roster.forEach(function(p){if(p.pos&&poss.indexOf(p.pos)<0)poss.push(p.pos)});poss.sort();
 var h='<div class="pt6"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2>Team roster</h2><p class="pagesub">'
 +(rosterTab==='current'
   ?(S.roster.length?S.roster.length+' player'+(S.roster.length===1?'':'s')+' on the roster. ':'No players yet — add your first player below. ')+'Players here can be slotted on the <button class="linklike" onclick="go(\'depth\')">depth chart</button>.'
   :((S.former.length?S.former.length+' former cadet'+(S.former.length===1?'':'s')+' from past teams, grouped by class year.':'No former cadets yet — players you move off the current roster land here with all their information.')))
 +'</p></div>'
 +(rosterTab==='current'?'<div class="frow"><div><label>Search</label><input style="width:11rem" placeholder="Name, position, #, club or college" value="'+esc(rosterQ)+'" oninput="rosterQ=this.value.toLowerCase();render()"></div><div><label>Position</label><select style="width:auto" onchange="rosterPos=this.value;render()"><option value="all">All positions</option>'+poss.map(function(x){return '<option'+(rosterPos===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div><div><label>Team</label><select style="width:8rem" onchange="rosterTeam=this.value;render()"><option value="all">All teams</option><option'+(rosterTeam==='Varsity'?' selected':'')+'>Varsity</option><option'+(rosterTeam==='JV'?' selected':'')+'>JV</option></select></div><div><label>Sort by</label><select style="width:10rem" onchange="rosterSort=this.value;render()"><option value="name">Last name</option><option value="year"'+(rosterSort==='year'?' selected':'')+'>Graduation year</option><option value="jersey"'+(rosterSort==='jersey'?' selected':'')+'>Jersey number</option><option value="team"'+(rosterSort==='team'?' selected':'')+'>Team (Varsity / JV)</option></select></div></div>':'')
 +'</div>';
 h+='<div class="subtabs"><button class="'+(rosterTab==='current'?'active':'')+'" onclick="rosterTab=\'current\';render()">Current roster</button><button class="'+(rosterTab==='former'?'active':'')+'" onclick="rosterTab=\'former\';render()">Former cadets ('+S.former.length+')</button></div>';
 var row=function(p,acts){
  var meta='Class of '+p.year+(p.pos?' · '+esc(p.pos):'')+(p.club?' · '+esc(p.club):'');
  return '<li class="divide-row"><div class="row" style="align-items:center;gap:1rem"><span class="avatar">'+esc(((p.first||'?')[0]||'?').toUpperCase())+esc(((p.last||'?')[0]||'?').toUpperCase())+'</span><div class="grow" style="min-width:0"><b style="font-size:1rem;font-weight:600">'+esc(fullName(p))+'</b>'+(p.jersey?' <span class="pill-outline">#'+esc(p.jersey)+'</span>':'')+(p.team?' <span class="pill">'+esc(p.team)+'</span>':'')+'<div style="margin-top:.125rem;font-size:.875rem;color:var(--mut)">'+meta+'</div>'+(p.college?'<div class="committed">Committed to '+esc(p.college)+'</div>':'')+(p.moved?'<div style="margin-top:.125rem;font-size:.75rem;color:var(--mut)">Moved '+esc(p.moved)+'</div>':'')+'</div><div class="row" style="gap:.5rem">'+acts+'</div></div></li>';
 };
 if(rosterTab==='former'){
  if(!S.former.length){h+='<div class="emptydash" style="margin-top:1.5rem"><b>No former cadets yet</b><p class="hint">Move players here from the roster when they graduate — they keep all of their information.</p></div>'}
  else{var groups={};S.former.slice().sort(function(a,b){return a.year-b.year||a.last.localeCompare(b.last)}).forEach(function(p){(groups[p.year]=groups[p.year]||[]).push(p)});
   h+=Object.keys(groups).sort().map(function(y){return '<h3 style="margin-top:1.5rem">Class of '+y+' <span style="margin-left:.5rem;font-size:.875rem;font-weight:600;text-transform:none;letter-spacing:normal;color:var(--mut)">'+groups[y].length+' cadet'+(groups[y].length===1?'':'s')+'</span></h3><ul class="divide-list" style="margin-top:.5rem">'+groups[y].map(function(p){return row(p,'<button class="small" onclick="moveBack('+p.id+')">Move back</button><button class="small" style="color:var(--red)" onclick="askConfirm(\'Delete permanently?\',function(){S.former=S.former.filter(function(x){return x.id!=='+p.id+'});render()})">Delete</button>')}).join('')+'</ul>'}).join('')}
  app.innerHTML=h+'</div>';return}
 var list=S.roster.filter(function(p){return (!rosterQ||fullName(p).toLowerCase().indexOf(rosterQ)>=0)&&(rosterPos==='all'||p.pos===rosterPos)&&(rosterTeam==='all'||(p.team||'Varsity')===rosterTeam)});
 list.sort(function(a,b){if(rosterSort==='year')return a.year-b.year||a.last.localeCompare(b.last);if(rosterSort==='jersey')return (+a.jersey||999)-(+b.jersey||999);if(rosterSort==='team')return (a.team||'').localeCompare(b.team||'');return a.last.localeCompare(b.last)});
 h+='<div class="card formcard" id="playerForm" style="margin-top:1.5rem"><p class="formtitle">'+(editPlayerId>=0?'Edit player':'Add a player')+'</p><div class="grid2"><div><label>First name</label><input id="pFirst"></div><div><label>Last name</label><input id="pLast"></div><div><label>Graduation year</label><input id="pYear" type="number" value="2028"></div><div><label>Position</label><input id="pPos" placeholder="Attack, Midfield, Defense, Goalie, Face-Off, LSM, SSDM"></div><div><label>Jersey number</label><input id="pJersey"></div><div><label>Team level</label><select id="pTeam"><option value="">Not set</option><option>Varsity</option><option>JV</option></select></div><div><label>Club team</label><input id="pClub"></div><div><label>Committed to play college at</label><input id="pCollege"></div></div><div class="row" style="margin-top:.75rem"><button class="primary" onclick="savePlayer()">'+(editPlayerId>=0?'Save changes':'Add player')+'</button>'+(editPlayerId>=0?'<button onclick="editPlayerId=-1;render()">Cancel edit</button>':'')+'</div></div>';
 if(!list.length)h+='<p class="empty-note">No players match that search.</p>';
 else h+='<ul class="divide-list" style="margin-top:1.5rem">'+list.map(function(p){return row(p,'<button class="small" onclick="editPlayerId='+p.id+';render();document.getElementById(\'playerForm\').scrollIntoView()">Edit</button><button class="small" onclick="moveToFormer('+p.id+')">Move to Former cadets</button><button class="small" style="color:var(--red)" onclick="askConfirm(\'Delete this player?\',function(){removePlayerEverywhere('+p.id+');render()})">Remove</button>')}).join('')+'</ul>';
 h+='<p class="note-dim">Removing a player also removes them from the depth chart. Moving a player to Former cadets does the same, but keeps all of their information in the roster history.</p>';
 app.innerHTML=h+'</div>';
 if(editPlayerId>=0){var p=S.roster.concat(S.former).filter(function(x){return x.id===editPlayerId})[0];if(p){document.getElementById('pFirst').value=p.first;document.getElementById('pLast').value=p.last;document.getElementById('pYear').value=p.year;document.getElementById('pPos').value=p.pos;document.getElementById('pJersey').value=p.jersey;document.getElementById('pTeam').value=p.team;document.getElementById('pClub').value=p.club;document.getElementById('pCollege').value=p.college}}
}

 h+='<div class="subtabs"><button class="'+(recTab==='list'?'active':'')+'" onclick="recTab=\'list\';render()">All recruits</button><button class="'+(recTab==='rank'?'active':'')+'" onclick="recTab=\'rank\';render()">Rankings</button></div>';
 if(recTab==='rank'){h+=rankHTML();app.innerHTML=h+'</div>';return}
 var list=S.recruits.filter(function(r){return (!recQ||(r.name+' '+r.school+' '+r.club+' '+(r.bio||'')).toLowerCase().indexOf(recQ)>=0)&&(recFilter==='all'||(recFilter==='committed'?r.committed:!r.committed))});
 list.sort(function(a,b){if(recSort==='stars')return b.stars-a.stars;if(recSort==='year')return a.year-b.year;return a.name.localeCompare(b.name)});
 h+='<div class="card formcard" id="recruitForm" style="margin-top:1.5rem"><p class="formtitle">'+(editRecId>=0?'Edit recruit':'Add a recruit')+'</p><div class="grid2"><div><label>Full name</label><input id="rName"></div><div><label>Position</label><input id="rPos"></div><div><label>Graduation year</label><input id="rYear" type="number" value="2031"></div><div><label>Current middle school</label><input id="rSchool"></div><div><label>Club team</label><input id="rClub"></div><div><label>Parent email</label><input id="rEmail" type="email"></div><div><label>Parent phone</label><input id="rPhone" type="tel"></div></div><div><label>Bio</label><textarea id="rBio" rows="2"></textarea></div><label style="display:flex;gap:.5rem;align-items:center;margin:0"><input type="checkbox" id="rCommitted" style="width:auto"> Committed to St. John\'s</label><label style="display:flex;gap:.5rem;align-items:center;margin:.5rem 0 0"><input type="checkbox" id="rShadow" style="width:auto" onchange="document.getElementById(\'rShadowDateWrap\').style.display=this.checked?\'block\':\'none\'"> Shadow day set up</label><div id="rShadowDateWrap" style="display:none;margin-top:.5rem"><label>Shadow day date</label><input id="rShadowDate" type="date"></div><div><label>Star rating</label><div id="formStarsBox" style="display:flex;align-items:center;gap:.5rem">'+formStarHTML()+'</div></div><div class="row" style="margin-top:.75rem"><button class="primary" onclick="saveRecruit()">'+(editRecId>=0?'Save changes':'Add recruit')+'</button>'+(editRecId>=0?'<button onclick="editRecId=-1;render()">Cancel edit</button>':'')+'</div></div>';
 if(!list.length)h+='<p class="empty-note">No recruits match that search.</p>';
 else h+='<ul class="divide-list" style="margin-top:1.5rem">'+list.map(function(r){var rank=(S.rankings[r.year]||[]).indexOf(r.name);return '<li class="divide-row"><div class="row" style="align-items:flex-start;gap:1rem"><div class="grow" style="min-width:0"><p style="margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:1rem;font-weight:600"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.name)+'</span>'+(r.committed?'<span class="pill-accent">Committed to St. John\'s</span>':'')+(rank>=0?'<span class="pill-outline">Ranked #'+(rank+1)+' · Class of '+r.year+'</span>':'')+(r.shadowDay&&r.shadowDate?'<span class="pill-outline">Shadow Day · '+fmtDateLong(r.shadowDate)+'</span>':'')+'</p><p style="margin:.125rem 0 0;font-size:.875rem;color:var(--mut)">'+esc(r.pos)+' · Class of '+r.year+' · '+esc(r.school)+' · Club: '+esc(r.club)+'</p><div class="row" style="gap:.5rem;margin-top:.25rem">'+starHTML(r,'list')+'<span style="font-size:.75rem;color:var(--mut)">'+(r.stars?r.stars+' of 5':'Not rated yet')+'</span></div>'+(r.bio?'<p style="margin:.25rem 0 0;font-size:.875rem;white-space:pre-wrap">'+esc(r.bio)+'</p>':'')+((r.email||r.phone)?'<p style="margin:.125rem 0 0;font-size:.875rem;color:var(--mut)">Parent: '+(r.email?'<a class="linklike" href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>':'')+(r.email&&r.phone?' · ':'')+(r.phone?'<a class="linklike" href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>':'')+'</p>':'')+'</div><div class="row" style="gap:.5rem;flex-shrink:0"><button class="small" onclick="editRecId='+r.id+';render();document.getElementById(\'recruitForm\').scrollIntoView()">Edit</button><button class="small" style="color:var(--red)" onclick="askConfirm(\'Remove this recruit?\',function(){S.recruits=S.recruits.filter(function(x){return x.id!=='+r.id+'});Object.keys(S.rankings).forEach(function(k){S.rankings[k]=S.rankings[k].filter(function(n){return n!==\''+esc(r.name).replace(/'/g,"\\'")+'\'})});render()})">Remove</button></div></div></li>'}).join('')+'</ul>';
 app.innerHTML=h+'</div>';
 if(editRecId>=0){var r=S.recruits.filter(function(x){return x.id===editRecId})[0];if(r){document.getElementById('rName').value=r.name;document.getElementById('rPos').value=r.pos;document.getElementById('rYear').value=r.year;document.getElementById('rSchool').value=r.school;document.getElementById('rClub').value=r.club;document.getElementById('rEmail').value=r.email;document.getElementById('rPhone').value=r.phone;document.getElementById('rBio').value=r.bio||'';document.getElementById('rCommitted').checked=!!r.committed;document.getElementById('rShadow').checked=!!r.shadowDay;document.getElementById('rShadowDate').value=r.shadowDate||'';document.getElementById('rShadowDateWrap').style.display=r.shadowDay?'block':'none'}}
}
function saveRecruit(){var name=document.getElementById('rName').value.trim();if(!name){toast('Enter the recruit\'s name');return}var obj={name:name,pos:document.getElementById('rPos').value.trim(),year:+document.getElementById('rYear').value||2031,school:document.getElementById('rSchool').value.trim(),club:document.getElementById('rClub').value.trim(),email:document.getElementById('rEmail').value.trim(),phone:document.getElementById('rPhone').value.trim(),bio:document.getElementById('rBio').value,committed:document.getElementById('rCommitted').checked,shadowDay:document.getElementById('rShadow').checked,shadowDate:document.getElementById('rShadow').checked?document.getElementById('rShadowDate').value:'',stars:Math.min(5,Math.max(0,formStars||0))};
 if(editRecId>=0){var r=S.recruits.filter(function(x){return x.id===editRecId})[0];var old=r.name;Object.assign(r,obj);Object.keys(S.rankings).forEach(function(k){S.rankings[k]=S.rankings[k].map(function(n){return n===old?obj.name:n})});if(!S.rankings[obj.year])S.rankings[obj.year]=[];if(S.rankings[obj.year].indexOf(obj.name)<0)S.rankings[obj.year].push(obj.name);editRecId=-1;toast('Recruit updated')}else{obj.id=id();S.recruits.push(obj);if(!S.rankings[obj.year])S.rankings[obj.year]=[];S.rankings[obj.year].push(obj.name);formStars=0;formStarsFor=-1;toast('Recruit added')}render()}
/* ---------- RECRUIT IMPORT (CSV/TSV/TXT/PDF) ---------- */
var recImportPending=null;
function recNormHeader(h){return String(h||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
var REC_COLS={
 name:['name','full name','fullname','recruit','recruit name','player','player name'],
 pos:['position','pos'],
 year:['grad year','graduation year','class','class of','grad','year','graduating class','grad yr'],
 school:['middle school','school','current middle school','current school'],
 club:['club','club team','clubteam'],
 email:['parent email','email','parentemail','email address','parent email address'],
 phone:['parent phone','phone','parent phone number','phone number','parent ph'],
 bio:['bio','notes','about'],
 committed:['committed','committed to st johns',"committed to st john's",'committed to st johns'],
 shadowDay:['shadow day','shadow day set up','shadowday','shadow day setup'],
 shadowDate:['shadow date','shadowday date','shadow day date'],
 stars:['stars','star rating','rating','star','stars out of 5']
};
function recColKey(h){var n=recNormHeader(h);for(var k in REC_COLS){if(REC_COLS[k].indexOf(n)>=0)return k}return null}
function recParseYesNo(v){var s=String(v||'').trim().toLowerCase();return s==='y'||s==='yes'||s==='true'||s==='1'||s==='x'||s==='\u2713'}
function recNormDate(v){var s=String(v||'').trim();if(!s)return '';var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m)return m[3]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);m=s.match(/^(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{4})$/i);if(m){var mos={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};return m[3]+'-'+mos[m[2].toLowerCase().slice(0,3)]+'-'+('0'+m[1]).slice(-2)}return ''}
function recParseYear(v){var s=String(v||'').trim();var m=s.match(/(20\d\d)/);if(m)return +m[1];var n=parseInt(s,10);if(n>=2000&&n<=2100)return n;return 0}
function recParseStars(v){var s=String(v||'');var m=s.match(/(\d)/);if(!m)return 0;return Math.min(5,Math.max(0,+m[1]))}
function recSplitLine(line,delim){var out=[],cur='',q=false;for(var i=0;i<line.length;i++){var c=line[i];if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else{if(c==='"')q=true;else if(c===delim){out.push(cur);cur=''}else cur+=c}}out.push(cur);return out.map(function(x){return x.trim()})}
function recDetectDelim(lines){for(var i=0;i<lines.length;i++){var l=lines[i];if(!l.trim())continue;var tabs=l.split('\t').length-1,commas=l.split(',').length-1;if(tabs>0&&tabs>=commas)return '\t';return ','}return ','}
function recParseTable(text){
 var lines=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
 var delim=recDetectDelim(lines);
 var hdrIdx=-1,map=null,hdrCells=0,maxCells=0;
 for(var i=0;i<lines.length;i++){if(!lines[i].trim())continue;var cells=recSplitLine(lines[i],delim);var m={},found=0;cells.forEach(function(c,idx){var k=recColKey(c);if(k&&!(k in m)){m[k]=idx;found++}});if(found>=2&&(m.name!==undefined||m.year!==undefined)){hdrIdx=i;map=m;hdrCells=cells.length;break}}
 if(hdrIdx<0||!map)return {header:false,rows:[],map:null,hdrCells:0,maxCells:0};
 var rows=[];
 for(var j=hdrIdx+1;j<lines.length;j++){var ln=lines[j];if(!ln.trim())continue;var c=recSplitLine(ln,delim);if(c.length>maxCells)maxCells=c.length;var get=function(k){return (map[k]!==undefined&&c[map[k]]!==undefined)?c[map[k]]:''};
  var sdVal=recNormDate(get('shadowDay'));
  var shadowDay=recParseYesNo(get('shadowDay'))||!!sdVal;
  var shadowDate=sdVal||recNormDate(get('shadowDate'));
  var r={name:get('name'),pos:get('pos'),year:recParseYear(get('year')),school:get('school'),club:get('club'),email:get('email'),phone:get('phone'),bio:get('bio'),committed:recParseYesNo(get('committed')),shadowDay:shadowDay,shadowDate:shadowDay?shadowDate:'',stars:recParseStars(get('stars'))};
  var probs=[];if(!r.name)probs.push('Missing name');if(!r.year)probs.push('Missing grad year');
  rows.push({rec:r,problems:probs});
 }
 return {header:true,rows:rows,map:map,hdrCells:hdrCells,maxCells:maxCells};
}
function recClassify(parsed){
 var seen={};S.recruits.forEach(function(r){seen[(r.name||'').toLowerCase().trim()+'|'+r.year]=1});
 var ok=[],skipped=[];
 parsed.rows.forEach(function(row){
  var key=(row.rec.name||'').toLowerCase().trim()+'|'+row.rec.year;
  if(row.problems.length)skipped.push({rec:row.rec,reason:row.problems.join('; ')});
  else if(seen[key])skipped.push({rec:row.rec,reason:'Already on the list (same name + grad year)'});
  else{seen[key]=1;ok.push(row.rec)}
 });
 return {ok:ok,skipped:skipped};
}
function recImportFile(el){var f=el.files&&el.files[0];el.value='';if(!f)return;var name=(f.name||'').toLowerCase();if(/\.pdf$/.test(name)){recImportPDF(f)}else{var rd=new FileReader();rd.onload=function(){recImportText(String(rd.result||''),'file')};rd.onerror=function(){recImportError('Could not read that file. Try again, or export the list as a CSV.')};rd.readAsText(f)}}
function recImportText(text,src){var parsed=recParseTable(text);if(!parsed.header||!parsed.rows.length){recImportError('No recruits found in that '+(src==='PDF'?'PDF':'file')+'. Make sure the first row lists the columns (Full name, Position, Grad year, …) with one recruit per line. If the list is a PDF with no selectable text, export it as a CSV instead.');return}var c=recClassify(parsed);recImportPending=c;recImportPreview(c)}
function recImportPreview(c){
 var rowHtml=function(r,st){var sh=r.shadowDay?(r.shadowDate?('Shadow Day · '+fmtDateLong(r.shadowDate)):'Shadow day set'):'';var st2=r.stars?('★'.repeat(r.stars)+'☆'.repeat(5-r.stars)+' ('+r.stars+' of 5)'):'Not rated';return '<tr><td>'+esc(r.name||'—')+'</td><td>'+esc(r.pos||'')+'</td><td>'+(r.year||'')+'</td><td>'+esc(r.school||'')+'</td><td>'+esc(r.club||'')+'</td><td>'+esc([r.email,r.phone].filter(function(x){return x}).join(' · ')||'')+'</td><td>'+esc(sh)+'</td><td>'+st2+'</td><td>'+st+'</td></tr>'};
 var h='<h3>Review import</h3><p class="pagesub">'+c.ok.length+' new recruit'+(c.ok.length===1?'':'s')+' will be added'+(c.skipped.length?' · '+c.skipped.length+' skipped':'')+'.</p>';

function chalkPosAt(pts,t){
 if(!pts||!pts.length) return {x:50,y:30};
 if(pts.length<2) return {x:pts[0].x,y:pts[0].y};
 var total=0, i;
 for(i=1;i<pts.length;i++) total+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
 if(total<=0) return {x:pts[0].x,y:pts[0].y};
 var d=chalkClamp(t,0,1)*total;
 for(i=1;i<pts.length;i++){
  var s=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  if(d<=s||i===pts.length-1){ var f=s?d/s:0; return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*f,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*f}; }
  d-=s;
 }
 var l=pts[pts.length-1]; return {x:l.x,y:l.y};
}

/* ---------- SERVER SYNC (one shared state for all approved accounts) ---------- */
var SYNC_KEYS=['cats','drills','roster','former','depth','recruits','rankings','plans','events','sessions','chalk','template','logo','teamColor','rankClass'];
var syncReady=false, syncTimer=null, syncRetry=0, syncPendingSave=false;
function syncSnapshot(){
 var out={};
 SYNC_KEYS.forEach(function(k){ if(k in S) out[k]=S[k]; });
 /* Drill video examples are session-only blob: URLs; never persist them. */
 out.drills=(S.drills||[]).map(function(d){ var c={}; for(var k in d) c[k]=d[k]; if(c.video&&String(c.video).indexOf('blob:')===0) c.video=''; return c; });
 return out;
}
function syncWriteLocal(){
 var body;
 try{ body=JSON.stringify(syncSnapshot()); }catch(e){ return null; }
 if(body.length>5*1024*1024) return null;
 try{ localStorage.setItem('sjc-shared-state-v1',body); }catch(e){}
 return body;
}
function planKey(p){ try{ return JSON.stringify(p); }catch(e){ return ''; } }
function mergeLocalPlans(localPlans){
 if(!Array.isArray(localPlans)||!localPlans.length) return 0;
 var have={};
 (S.plans||[]).forEach(function(p){ var k=planKey(p); if(k) have[k]=1; });
 var added=0;
 localPlans.forEach(function(p){
  if(!p||typeof p!=='object') return;
  var k=planKey(p);
  if(k&&!have[k]){ S.plans.push(p); have[k]=1; added++; }
 });
 return added;
}
function syncSaveImmediate(){
 var body=syncWriteLocal();
 if(!body){ syncShow('Too large to save online',true); return; }
 if(!syncReady){ syncPendingSave=true; syncShow('Saving…'); return; }
 if(syncTimer){ clearTimeout(syncTimer); syncTimer=null; }
 syncSaveNow();
}
function syncShow(msg,bad){ var el=document.getElementById('saveState'); if(el){ el.textContent=msg; el.style.color=bad?'var(--bad)':'var(--mut)'; } }
function syncSaveNow(){
 if(!syncReady) return;
 var body;
 try{ body=JSON.stringify(syncSnapshot()); }catch(e){ return; }
 if(body.length>5*1024*1024){ syncShow('Too large to save online',true); return; }
 syncShow('Saving…');
 fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:body,credentials:'same-origin'})
  .then(function(r){ if(r.status===401){ idleLogout(); throw new Error('session expired'); } if(!r.ok) throw new Error('save failed '+r.status); return r.json(); })
  .then(function(){ syncRetry=0; syncShow('Saved ✓'); try{ localStorage.setItem('sjc-shared-state-v1',body); }catch(e){} })
  .catch(function(){
   try{ localStorage.setItem('sjc-shared-state-v1',body); }catch(e){}
   if(syncRetry<3){ syncRetry++; syncShow('Saving…'); setTimeout(syncSaveNow,3000*syncRetry); }
   else syncShow('Save failed — kept on this device',true);
  });
}
function scheduleSave(){
 if(!syncReady){ syncPendingSave=true; return; }
 if(syncTimer) clearTimeout(syncTimer);
 syncTimer=setTimeout(syncSaveNow,1500);
}
function syncApply(d){
 if(!d||typeof d!=='object'||Array.isArray(d)) return false;
 var ok=false;
 SYNC_KEYS.forEach(function(k){
  if(!(k in d)) return;
  var v=d[k];
  if(k==='depth'||k==='rankings'){ if(v&&typeof v==='object'&&!Array.isArray(v)){ S[k]=v; ok=true; } }
  else if(k==='template'||k==='logo'||k==='teamColor'){ if(typeof v==='string'){ S[k]=v; ok=true; } }
  else if(k==='rankClass'){ if(typeof v==='number'){ S.rankClass=v; ok=true; } }
  else if(Array.isArray(v)){ S[k]=v; ok=true; }
 });
 /* Keep new ids unique after loading saved state. */
 var maxId=0;
 ['drills','roster','former','recruits'].forEach(function(k){
  (S[k]||[]).forEach(function(x){ if(x&&typeof x.id==='number'&&x.id>maxId) maxId=x.id; });
 });
 (S.chalk||[]).forEach(function(pl){
  if(pl&&typeof pl.id==='number'&&pl.id>maxId) maxId=pl.id;
  (pl.players||[]).forEach(function(x){ if(x&&typeof x.id==='number'&&x.id>maxId) maxId=x.id; });
 });
 if(maxId>=uid) uid=maxId+1;
 return ok;
}
function syncLoadLocal(){
 try{ var raw=localStorage.getItem('sjc-shared-state-v1'); if(raw) return JSON.parse(raw); }catch(e){}
 return null;
}
var _render=render;
render=function(){ _render(); scheduleSave(); };
window.addEventListener('beforeunload',function(){
 if(!syncReady){ if(syncPendingSave) syncWriteLocal(); return; }
 if(syncTimer){ clearTimeout(syncTimer); syncTimer=null; }
 try{
  var body=JSON.stringify(syncSnapshot());
  if(body.length<=5*1024*1024){
   fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:body,credentials:'same-origin',keepalive:true});
  }
  try{ localStorage.setItem('sjc-shared-state-v1',body); }catch(e){}
 }catch(e){}
});
/* ---------- Idle auto-logout: 1 hour without activity ---------- */
var IDLE_LIMIT_MS = 60*60*1000;
var IDLE_KEY = 'sjc-last-activity-v1';
var IDLE_MARK_MIN_MS = 30*1000;
var idleTimer = null, idleLoggingOut = false, idleLastMark = 0;
function idleGetLast(){ try{ var v=parseInt(localStorage.getItem(IDLE_KEY)||'0',10); return v||0; }catch(e){ return 0; } }
function idleFlushSave(){
  try{
    if(typeof syncTimer!=='undefined'&&syncTimer){ clearTimeout(syncTimer); syncTimer=null; }
    if(typeof syncReady!=='undefined'&&syncReady&&typeof syncSnapshot==='function'){
      var body=JSON.stringify(syncSnapshot());
      if(body.length<=5*1024*1024){
        fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:body,credentials:'same-origin',keepalive:true});
      }
      try{ localStorage.setItem('sjc-shared-state-v1',body); }catch(e){}
    }
    else if(typeof syncPendingSave!=='undefined'&&syncPendingSave){ syncWriteLocal(); }
  }catch(e){}
}
function idleLogout(){
  if(idleLoggingOut) return; idleLoggingOut=true;
  if(idleTimer) clearTimeout(idleTimer);
  idleFlushSave();
  try{ localStorage.removeItem(IDLE_KEY); }catch(e){}
  var done=function(){ window.location.href='/login?notice=idle'; };
  try{ fetch('/api/logout',{method:'POST',credentials:'same-origin',keepalive:true}).then(done,done); setTimeout(done,1500); }
  catch(e){ done(); }
}
function doLogout(){
  if(idleLoggingOut) return; idleLoggingOut=true;
  if(idleTimer) clearTimeout(idleTimer);
  idleFlushSave();
  try{ localStorage.removeItem(IDLE_KEY); }catch(e){}
  var done=function(){ window.location.href='/login?notice=logged-out'; };
  try{ fetch('/api/logout',{method:'POST',credentials:'same-origin',keepalive:true}).then(done,done); setTimeout(done,1500); }
  catch(e){ done(); }
}
function idleArm(){
  if(idleLoggingOut) return;
  if(idleTimer) clearTimeout(idleTimer);
  var remaining = IDLE_LIMIT_MS - (Date.now() - idleGetLast());
  if(remaining<=0){ idleLogout(); return; }
  idleTimer=setTimeout(idleLogout, remaining);
}
function idleMark(){
  if(idleLoggingOut) return;
  var now=Date.now();
  if(now-idleLastMark<IDLE_MARK_MIN_MS) return;
  idleLastMark=now;
  try{ localStorage.setItem(IDLE_KEY,String(now)); }catch(e){}
  idleArm();
}
['click','keydown','mousemove','scroll','touchstart'].forEach(function(ev){
  window.addEventListener(ev, idleMark, {passive:true});
});
window.addEventListener('storage', function(e){ if(e.key===IDLE_KEY) idleArm(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) idleArm(); });
window.addEventListener('focus', idleArm);
idleMark();
/* ---------- Welcome: "Welcome, <first name>" next to Log out ---------- */
function welcomeFirstName(u){
  if(!u) return '';
  var n=String(u.name||'').trim();
  if(n) return n.split(/\s+/)[0];
  var e=String(u.email||'').trim();
  if(e) return e.split('@')[0];
  return '';
}
function loadWelcome(){
  var el=document.getElementById('welcomeUser');
  if(!el) return;
  fetch('/api/me',{credentials:'same-origin'})
    .then(function(r){ if(!r.ok) throw new Error('me '+r.status); return r.json(); })
    .then(function(j){
      var u=(j&&j.user)||j;
      var fn=welcomeFirstName(u);
      if(fn){ el.textContent='Welcome, '+fn; el.style.display=''; }
    })
    .catch(function(){});
}
(function boot(){
 fetch('/api/data',{credentials:'same-origin'})
  .then(function(r){ if(r.status===401){ window.location.href='/login?notice=idle'; throw new Error('session expired'); } if(!r.ok) throw new Error('load failed '+r.status); return r.json(); })
  .then(function(j){
   var localBefore=syncLoadLocal();
   if(j&&j.data&&syncApply(j.data)) syncShow('Loaded ✓');
   else syncShow('Ready');
   if(localBefore&&mergeLocalPlans(localBefore.plans)){ syncPendingSave=true; syncShow('Saved locally — syncing…'); }
   loadWelcome();
  })
  .catch(function(){
   var local=syncLoadLocal();
   if(local&&syncApply(local)) syncShow('Offline copy loaded',true);
   else syncShow('Ready');
   /* No backend here (e.g. the public static site): there is no session, so no Log out. */
   var lb=document.getElementById('logoutBtn'); if(lb) lb.style.display='none';
  })
  .then(function(){ syncReady=true; _render(); if(syncPendingSave){ syncPendingSave=false; syncSaveNow(); } });
})();
</script>
</body>
</html>
